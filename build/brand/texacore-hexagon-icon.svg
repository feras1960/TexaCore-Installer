<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="threadGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <g transform="translate(256,256) scale(1.22) translate(-256,-256)">
    <!-- Hexagon with rounded corners (fill+stroke same gradient, round join) -->
    <polygon points="256,80 400,150 400,330 256,400 112,330 112,150"
             fill="url(#hexGradient)" stroke="url(#hexGradient)"
             stroke-width="44" stroke-linejoin="round"/>

    <!-- Inner hexagon outline, rounded -->
    <polygon points="256,116 364,168 364,312 256,364 148,312 148,168"
             fill="none" stroke="rgba(255,255,255,0.22)"
             stroke-width="3" stroke-linejoin="round"/>

    <!-- Thread/fabric wave (exact original brand logo) -->
    <path d="M130,256 Q190,180 256,256 T382,256"
          stroke="url(#threadGradient)" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M160,256 Q205,200 256,256 T352,256"
          stroke="rgba(255,255,255,0.3)" stroke-width="12" fill="none" stroke-linecap="round"/>

    <!-- Core -->
    <circle cx="256" cy="256" r="45" fill="white" opacity="0.95"/>
    <circle cx="256" cy="256" r="22" fill="#047857" opacity="0.6"/>
  </g>
</svg>
